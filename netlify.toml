[build]
  command = "npm run build"
  publish = ".next"

# Apply committed schema migrations before publishing production code.
# Preview builds must never migrate the shared production database.
[context.production]
  # Loopia uses a direct MySQL connection for both runtime and migrations.
  command = 'DIRECT_URL="$DATABASE_URL" npx prisma migrate resolve --rolled-back 20261116190000_cms_foundations && DIRECT_URL="$DATABASE_URL" npm run db:migrate && npm run build'

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
